version: '3.9'

# Production / CI compose — no host ports for postgres or backend.
# For local development, layer docker-compose.dev.yml on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - admin_dashboard
      - request_web
    restart: unless-stopped
    networks:
      - frontend
      - backend_net

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    # No host ports — not reachable outside Docker network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-appdb}
      DEV_FIXED_OTP_ENABLED: "false"           # Must be explicitly enabled in dev
      DEV_FIXED_OTP_VALUE: ${DEV_FIXED_OTP_VALUE:-000000}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-5}
      RATE_LIMIT_OTP_PER_MINUTE: ${RATE_LIMIT_OTP_PER_MINUTE:-3}
    networks:
      - backend_net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # No host ports — accessed only through Nginx at /api/

  admin_dashboard:
    build:
      context: ./apps/admin_dashboard
      dockerfile: Dockerfile
    networks:
      - backend_net
    restart: unless-stopped
    # Stack: React 18 — see apps/admin_dashboard/package.json

  request_web:
    build:
      context: ./apps/request_web
      dockerfile: Dockerfile
    networks:
      - backend_net
    restart: unless-stopped

networks:
  frontend:
  backend_net:

volumes:
  pgdata:
